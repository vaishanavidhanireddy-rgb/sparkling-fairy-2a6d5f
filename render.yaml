services:
  - type: web
    name: healthcare-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm ci && npm run build
    startCommand: gunicorn healthcare:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MAIL_VERIFICATION_ENABLED
        value: "0"
      - key: MAIL_OTP_ENABLED
        value: "0"
      - key: PUBLIC_BASE_URL
        value: https://healthcare-backend-0s3d.onrender.com
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "1"