services:
  - type: web
    name: healthcare-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: MAIL_VERIFICATION_ENABLED
        value: "0"
      - key: MAIL_OTP_ENABLED
        value: "0"
      - key: PUBLIC_BASE_URL
        value: https://healthcare-backend.onrender.com
      - key: HOST
        value: 0.0.0.0